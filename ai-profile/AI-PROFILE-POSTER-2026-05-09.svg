  <!-- Footer Section -->
  <line x1="150" y1="1050" x2="650" y2="1050" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>

  <text x="400" y="1090" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#accentGradient)" text-anchor="middle">
