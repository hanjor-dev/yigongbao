  </text>
  <rect x="150" y="390" width="500" height="20" rx="10" fill="#2a2a3e"/>
  <rect x="150" y="390" width="262.5" height="20" rx="10" fill="url(#accentGradient)"/>
  <text x="655" y="405" font-family="Arial, sans-serif" font-size="14" fill="#00d4ff" text-anchor="start">
    127/242
  </text>


