  <g id="traits">
    <!-- Trait 1 -->
    <rect x="150" y="870" width="280" height="60" rx="10" fill="#1e3a5f" opacity="0.8"/>
    <text x="170" y="895" font-family="Arial, sans-serif" font-size="24" fill="#00d4ff">
