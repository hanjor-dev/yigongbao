    </text>
    <text x="194" y="640" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="end">
      3.9%
    </text>

    <!-- Order Module -->
    <rect x="150" y="660" width="39" height="30" rx="5" fill="#a29bfe" opacity="0.8"/>
    <text x="160" y="680" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">
      订单模块
    </text>
    <text x="194" y="680" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="end">
      3.9%
    </text>
  </g>


  <!-- Tech Stack Section -->
