    <!-- Trait 2 -->
    <rect x="450" y="870" width="280" height="60" rx="10" fill="#1e3a5f" opacity="0.8"/>
    <text x="470" y="895" font-family="Arial, sans-serif" font-size="24" fill="#00ff88">
