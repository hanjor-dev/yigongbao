    </text>
    <text x="200" y="330" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8">
      会话总数
    </text>
    
    <!-- AI Collaboration -->
    <text x="400" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00ff88" text-anchor="middle">
      52.5%
    </text>
    <text x="400" y="330" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8">
      AI 协作占比
    </text>
    
    <!-- Commits -->
    <text x="600" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ff6b6b" text-anchor="middle">
      127
    </text>
    <text x="600" y="330" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8">
      AI 协作提交
    </text>
  </g>

  <!-- Progress Bar -->
  <text x="150" y="380" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.9">
