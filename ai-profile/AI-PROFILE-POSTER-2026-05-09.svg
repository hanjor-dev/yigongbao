    </text>

    <!-- Trait 3 -->
    <rect x="150" y="945" width="280" height="60" rx="10" fill="#1e3a5f" opacity="0.8"/>
    <text x="170" y="970" font-family="Arial, sans-serif" font-size="24" fill="#ffd93d">
      ✓
    </text>
    <text x="200" y="970" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">
