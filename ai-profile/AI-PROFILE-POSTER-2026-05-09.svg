    </text>
    <text x="170" y="993" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.7">
      涵盖 6 个业务模块和技术栈
    </text>

    <!-- Trait 4 -->
    <rect x="450" y="945" width="280" height="60" rx="10" fill="#1e3a5f" opacity="0.8"/>
    <text x="470" y="970" font-family="Arial, sans-serif" font-size="24" fill="#ff6b6b">
      ✓
    </text>
    <text x="500" y="970" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="bold">
