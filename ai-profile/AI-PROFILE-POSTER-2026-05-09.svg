<svg width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bgGradient)"/>

  <!-- Header Section -->
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#accentGradient)" text-anchor="middle" filter="url(#glow)">
    AI-Native Developer
  </text>

  <text x="400" y="120" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">
    开发者档案
  </text>

  <line x1="200" y1="140" x2="600" y2="140" stroke="url(#accentGradient)" stroke-width="2"/>

  <!-- Developer Info -->
  <text x="400" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    hanjor
  </text>

  <text x="400" y="210" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" text-anchor="middle">
    医工宝 (yigongbao) · 2026-05-09
  </text>

  <!-- Core Stats Section -->
  <rect x="100" y="250" width="600" height="180" rx="15" fill="#1e3a5f" opacity="0.8"/>
  
  <!-- Stats Grid -->
  <g id="stats">
    <!-- Sessions -->
    <text x="200" y="300" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle">
