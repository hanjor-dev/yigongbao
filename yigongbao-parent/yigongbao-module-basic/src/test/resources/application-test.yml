spring:
  profiles:
    active: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 1GB
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  interceptor:
    enable: false

# dromara x-file-storage 测试配置
dromara:
  x-file-storage:
    default-platform: local-1
    local:
      - platform: local-1
        enable-storage: true
        enable-access: true
        domain: http://localhost:8080/api/files/public/
        path-patterns: /api/files/public/**
        base-path: ${java.io.tmpdir}/yigongbao-test-files/

# 医工宝自定义配置（测试环境）
yigongbao:
  config:
    # 安全配置
    default-password: "123456"
    login-max-failures: 5
    login-lock-duration: 15
    sms-send-interval: 60
    # 系统配置
    system-name: "医工宝测试"
    max-upload-size: 524288000
    # 订单配置
    order-image-required: true
    order-draft-expire-days: 30
    order-modify-window-minutes: 10
  # 文件存储业务配置
  file-storage:
    max-file-size: 524288000
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - zip
      - rar
      - stl
      - obj
      - 3ds
      - ply
      - step
      - dcm
