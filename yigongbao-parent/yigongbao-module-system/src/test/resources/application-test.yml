spring:
  profiles:
    active: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 1GB
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 测试环境禁用 Sa-Token 登录拦截器
sa-token:
  interceptor:
    enable: false

# 医工宝自定义配置（测试环境）
yigongbao:
  config:
    default-values:
      default-password: "123456"
      login-max-failures: 5
      login-lock-duration: 15
      sms-send-interval: 60
      max-upload-size: 524288000
  # 文件存储业务配置
  file-storage:
    max-file-size: 524288000
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - zip
      - rar
      - stl
      - obj
      - 3ds
      - ply
      - step
      - dcm
