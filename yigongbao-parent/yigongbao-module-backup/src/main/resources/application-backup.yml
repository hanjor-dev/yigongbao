yigongbao:
  backup:
    # 危险能力默认关闭；Task 20 的全部硬闸门完成前不得开启。
    cos-deletion-enabled: false
    security:
      # 只在 test profile 生效，生产环境即使误配也不会旁路认证。
      allow-unverified-requests-for-tests: false
      # 签名时间允许偏差，默认 5 分钟。
      clock-skew-seconds: 300
      # 内部机器请求体最大 10 MiB；超过上限的请求在验签前拒绝。
      max-body-bytes: 10485760
