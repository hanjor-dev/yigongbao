spring:
  profiles:
    active: test
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql

# 禁用 SaToken 拦截器，避免测试时需要登录
satoken:
  interceptor:
    enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 医工宝自定义配置（测试环境）
yigongbao:
  config:
    default-values:
      default-password: "123456"
      login-max-failures: 5
      login-lock-duration: 15
      sms-send-interval: 60
      max-upload-size: 10485760
