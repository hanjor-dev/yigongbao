server:
  # 服务器端口
  port: 8081
  servlet:
    # 项目 context-path
    context-path: /api
  # Tomcat 配置
  tomcat:
    # 最大工作线程数
    max-threads: 200
    #最小工作线程数
    min-spare-threads: 10

spring:
  # 数据源配置（Docker 环境）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Docker 环境：使用服务名 mysql，标准端口 3306
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:yigongbao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000

  # Redis 配置（Docker 环境）
  data:
    redis:
      # Docker 环境：使用服务名 redis
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大空闲连接数
          max-idle: 8
          # 连接池最小空闲连接数
          min-idle: 0
          # 连接池最大阻塞等待时间（毫秒）
          max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      # 忽略 Map 中的 null 值
      write-null-map-values: false

  # 邮件配置（测试环境，发件邮箱和密码通过环境变量注入）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # 文件上传配置
  servlet:
    multipart:
      # 启用 multipart 上传
      enabled: true
      # 最大单个文件大小（全局上限 2GB，各业务类型由业务层单独校验）
      max-file-size: 2GB
      # 最大请求总大小（全局上限 2GB）
      max-request-size: 2GB
      # 文件写入磁盘的阈值
      file-size-threshold: 512KB

# MyBatis-Plus 配置
mybatis-plus:
  # 配置扫描通用枚举
  type-enums-package: com.yigongbao.common.enums
  global-config:
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除字段（软删除）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 禁用 SQL 日志输出
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  # 配置扫描 XML
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（秒），默认 30 天
  timeout: 2592000
  # token 临时有效期（秒），指定时间后 token 失效
  active-timeout: -1
  # 是否允许同一账号多端同时在线
  is-concurrent: true
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# dromara x-file-storage 配置（文件存储框架）
dromara:
  x-file-storage:
    # 默认存储平台（使用阿里云 OSS）
    default-platform: aliyun-oss-1
    #缩略图后缀
    thumbnail-suffix: ".min.jpg"
    # 阿里云 OSS 配置（测试环境可选）
    aliyun-oss:
      - platform: aliyun-oss-1
        enable-storage: false
        # AccessKey ID（从环境变量注入，禁止硬编码）
        access-key: ${OSS_ACCESS_KEY:your-access-key-id}
        # AccessKey Secret（从环境变量注入，禁止硬编码）
        secret-key: ${OSS_SECRET_KEY:your-access-key-secret}
        # OSS Endpoint（以华东1杭州为例，按实际地域修改）
        end-point: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
        # Bucket 名称
        bucket-name: ${OSS_BUCKET:yigongbao}
        # 文件访问域名（CDN 域名或 OSS 公网域名）
        domain: ${OSS_DOMAIN:https://yigongbao.oss-cn-hangzhou.aliyuncs.com/}
        # 存储路径前缀（可为空）
        base-path:
    # 本地存储（测试环境默认平台）
    local-plus:
      - platform: local-plus-1
        # 启用本地存储
        enable-storage: true
        # 启用本地文件访问
        enable-access: true
        # 文件访问基础路径（Docker 环境）
        domain: http://localhost:8080/api/files/public/
        # 基础路径
        base-path:
        # URL 路径匹配模式（SaToken 中需放行此路径）
        path-patterns: /files/public/**
        # 存储根路径（Docker 容器内路径）
        storage-path: /app/files/

# 应用安全配置
app:
  sign:
    # 请求签名密钥
    secret: ${APP_SIGN_SECRET:test-secret-change-in-prod}
  rate-limit:
    # 全局默认限流：每个接口独立计数，60次/分钟（约5次/秒）
    default-limit: 60
    # 时间窗口（秒）
    default-window: 60

# 医工宝系统配置
yigongbao:
  # 文件存储业务配置
  file-storage:
    # 最大文件大小（字节），全局上限 2GB
    max-file-size: 2147483648

# 短信配置
sms:
  mock:
    # 测试环境短信 Mock 重定向邮箱
    redirect-email: ${SMS_MOCK_REDIRECT_EMAIL:hanjor666@qq.com}

# 行为验证码配置
captcha:
  prefix: captcha
  expire:
    default: 120000
    WORD_IMAGE_CLICK: 120000
  init-default-resource: true
  local-cache-enabled: false
  local-cache-size: 20
  local-cache-wait-time: 5000
  local-cache-period: 2000
  local-cache-ignored-cache-fields: ""
  font-path:
    - classpath:font/SimHei.ttf
  secondary:
    enabled: true
    expire: 120000
    keyPrefix: "captcha:secondary"

# springdoc-openapi 配置（测试环境启用 Swagger UI）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
