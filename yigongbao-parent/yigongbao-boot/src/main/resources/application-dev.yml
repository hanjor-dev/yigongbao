server:
  # 服务器端口
  port: 8080
  servlet:
    # 项目 context-path
    context-path: /api
  # Tomcat 配置
  tomcat:
    # 最大工作线程数
    max-threads: 200
    #最小工作线程数
    min-spare-threads: 10

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:yigongbao}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大空闲连接数
          max-idle: 8
          # 连接池最小空闲连接数
          min-idle: 0
          # 连接池最大阻塞等待时间（毫秒）
          max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      # 忽略 Map 中的 null 值
      write-null-map-values: false

  # 邮件配置（开发环境，发件邮箱和密码通过环境变量注入）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # 文件上传配置
  servlet:
    multipart:
      # 启用 multipart 上传
      enabled: true
      # 最大单个文件大小（全局上限 2GB，各业务类型由业务层单独校验）
      max-file-size: 2GB
      # 最大请求总大小（全局上限 2GB）
      max-request-size: 2GB
      # 文件写入磁盘的阈值
      file-size-threshold: 512KB

# MyBatis-Plus 配置
mybatis-plus:
  # 配置扫描通用枚举
  type-enums-package: com.yigongbao.common.enums
  global-config:
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除字段（软删除）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 禁用 SQL 日志输出
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  # 配置扫描 XML
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（秒），默认 30 天
  timeout: 2592000
  # token 临时有效期（秒），指定时间后 token 失效
  active-timeout: -1
  # 是否允许同一账号多端同时在线
  is-concurrent: true
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# dromara x-file-storage 配置（文件存储框架）
dromara:
  x-file-storage:
    # 默认存储平台（使用阿里云 OSS）
    default-platform: aliyun-oss-1
    #缩略图后缀
    thumbnail-suffix: ".min.jpg"
    # 阿里云 OSS 配置
    aliyun-oss:
      - platform: aliyun-oss-1
        enable-storage: true
        # AccessKey ID（从环境变量注入，禁止硬编码）
        access-key: ${OSS_ACCESS_KEY:your-access-key-id}
        # AccessKey Secret（从环境变量注入，禁止硬编码）
        secret-key: ${OSS_SECRET_KEY:your-access-key-secret}
        # OSS Endpoint（以华东1杭州为例，按实际地域修改）
        end-point: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
        # Bucket 名称
        bucket-name: ${OSS_BUCKET:yigongbao}
        # 文件访问域名（CDN 域名或 OSS 公网域名）
        domain: ${OSS_DOMAIN:https://yigongbao.oss-cn-hangzhou.aliyuncs.com/}
        # 存储路径前缀（可为空）
        base-path:
    # 本地存储（开发备用，不作为默认平台）
    local-plus:
      - platform: local-plus-1
        # 启用本地存储
        enable-storage: true
        # 启用本地文件访问（生产环境建议使用 Nginx）
        enable-access: true
        # 文件访问基础路径（用于拼装 fileUrl），/api 前缀与 context-path 保持一致
        domain: http://yigongbao.hanjor.top/api/files/public/
        # 基础路径
        base-path:
        # URL 路径匹配模式（SaToken 中需放行此路径）
        path-patterns: /files/public/**
        # 存储根路径（映射到 URL /files/public/**）
        storage-path: D:/yigongbao-files/

# 应用安全配置
app:
  sign:
    # 请求签名密钥，生产环境通过环境变量 APP_SIGN_SECRET 注入
    secret: ${APP_SIGN_SECRET:dev-secret-change-in-prod}
  rate-limit:
    # 全局默认限流：每个接口独立计数，300次/分钟（约5次/秒）
    default-limit: 300
    # 时间窗口（秒）
    default-window: 60

# 医工宝系统配置
yigongbao:
  # 文件存储业务配置
  file-storage:
    # 最大文件大小（字节），全局上限 2GB
    max-file-size: 2147483648

# 短信配置
sms:
  mock:
    # 开发阶段短信 Mock 重定向邮箱：将短信验证码以邮件形式转发到此邮箱（留空则仅打印日志）
    redirect-email: ${SMS_MOCK_REDIRECT_EMAIL:hanjor666@qq.com}

# 行为验证码配置， 详细请看 cloud.tianai.captcha.autoconfiguration.ImageCaptchaProperties 类
captcha:
  # 如果项目中使用到了redis，滑块验证码会自动把验证码数据存到redis中， 这里配置redis的key的前缀,默认是captcha:slider
  prefix: captcha
  # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
  expire:
    # 默认缓存时间 2分钟
    default: 120000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 120000
  # 使用加载系统自带的资源， 默认是 false(这里系统的默认资源包含 滑动验证码模板/旋转验证码模板,如果想使用系统的模板，这里设置为true)
  init-default-resource: true
  # 缓存控制， 默认为false不开启
  local-cache-enabled: false
  # 缓存开启后，验证码会提前缓存一些生成好的验证数据， 默认是20
  local-cache-size: 20
  # 缓存开启后，缓存拉取失败后等待时间 默认是 5秒钟
  local-cache-wait-time: 5000
  # 缓存开启后，缓存检查间隔 默认是2秒钟
  local-cache-period: 2000
  # 缓存开启后，忽略的字段，默认是 ""(不忽略任何字段)
  local-cache-ignored-cache-fields: ""
  # 配置字体包，供文字点选验证码使用,可以配置多个，不配置使用默认的字体
  font-path:
    - classpath:font/SimHei.ttf
  secondary:
    # 二次验证，默认开启（验证码校验成功后生成 token，登录时必须验证 token）
    enabled: true
    # 二次验证过期时间， 默认 2分钟
    expire: 120000
    # 二次验证缓存key前缀，默认是 captcha:secondary
    keyPrefix: "captcha:secondary"


# springdoc-openapi 配置（用于 Apifox 导入）
springdoc:
  api-docs:
    # OpenAPI JSON 文档访问路径（相对于 context-path）
    # 实际访问地址：http://localhost:8080/api/v3/api-docs
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 访问路径（dev 环境启用，方便快速预览）
    # 实际访问地址：http://localhost:8080/api/swagger-ui.html
    enabled: true
    path: /swagger-ui.html
