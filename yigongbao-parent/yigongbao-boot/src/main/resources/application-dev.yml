server:
  # 服务器端口
  port: 8080
  servlet:
    # 项目 context-path
    context-path: /api
  # Tomcat 配置
  tomcat:
    # 最大工作线程数
    max-threads: 200
    #最小工作线程数
    min-spare-threads: 10

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/yigongbao?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接池大小
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 8
          # 连接池最大空闲连接数
          max-idle: 8
          # 连接池最小空闲连接数
          min-idle: 0
          # 连接池最大阻塞等待时间（毫秒）
          max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      # 忽略 Map 中的 null 值
      write-null-map-values: false

  # 文件上传配置
  servlet:
    multipart:
      # 启用 multipart 上传
      enabled: true
      # 最大单个文件大小（默认 500MB）
      max-file-size: 500MB
      # 最大请求总大小（默认 500MB）
      max-request-size: 500MB
      # 文件写入磁盘的阈值
      file-size-threshold: 512KB

# MyBatis-Plus 配置
mybatis-plus:
  # 配置扫描通用枚举
  type-enums-package: com.yigongbao.common.enums
  global-config:
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除字段（软删除）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 禁用 SQL 日志输出
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  # 配置扫描 XML
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（秒），默认 30 天
  timeout: 2592000
  # token 临时有效期（秒），指定时间后 token 失效
  active-timeout: -1
  # 是否允许同一账号多端同时在线
  is-concurrent: true
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# dromara x-file-storage 配置（文件存储框架）
dromara:
  x-file-storage:
    # 默认存储平台
    default-platform: local-plus-1
    #缩略图后缀
    thumbnail-suffix: ".min.jpg"
    # 本地存储（支持框架自动配置静态资源访问）
    local-plus:
      - platform: local-plus-1
        # 启用本地存储
        enable-storage: true
        # 启用本地文件访问（生产环境建议使用 Nginx）
        enable-access: true
        # 文件访问基础路径（用于拼装 fileUrl），/api 前缀与 context-path 保持一致
        domain: http://localhost:8080/api/files/public/
        # 基础路径
        base-path:
        # URL 路径匹配模式（SaToken 中需放行此路径）
        path-patterns: /files/public/**
        # 存储根路径（映射到 URL /files/public/**）
        storage-path: D:/yigongbao-files/

# 医工宝系统配置
yigongbao:
  # 系统配置兜底默认值（当数据库配置不存在或已禁用时使用）
  config:
    # ==================== 安全配置 ====================
    # 默认密码
    default-password: "123456"
    # 最大连续登录失败次数
    login-max-failures: 5
    # 登录锁定时长（分钟）
    login-lock-duration: 15
    # 短信发送间隔（秒）
    sms-send-interval: 60
    # ==================== 系统配置 ====================
    # 系统名称
    system-name: "医工宝"
    # 文件上传最大大小（字节），默认 500MB
    max-upload-size: 524288000
    # ==================== 订单配置 ====================
    # 提交订单是否必须上传影像文件（true-必须，false-非必填）
    order-image-required: true
    # 草稿自动过期天数，默认 30 天
    order-draft-expire-days: 30
    # 订单提交后修改窗口期（分钟），默认 10 分钟
    order-modify-window-minutes: 10
    # ==================== 流程状态机配置 ====================
    # 最大允许的审核驳回次数，默认 3 次
    flow-max-audit-reject: 3
    # 最大允许的返工次数，默认 2 次
    flow-max-rework: 2
    # 最大允许的设计审核驳回次数，默认 3 次
    flow-max-design-reject: 3
  # 文件存储业务配置
  file-storage:
    # 最大文件大小（字节），默认 500MB
    max-file-size: 524288000
    # 允许的文件扩展名
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - zip
      - rar
      - stl
      - obj
      - 3ds
      - ply
      - step
      - dcm

# springdoc-openapi 配置（用于 Apifox 导入）
springdoc:
  api-docs:
    # OpenAPI JSON 文档访问路径（相对于 context-path）
    # 实际访问地址：http://localhost:8080/api/v3/api-docs
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 访问路径（dev 环境启用，方便快速预览）
    # 实际访问地址：http://localhost:8080/api/swagger-ui.html
    enabled: true
    path: /swagger-ui.html
