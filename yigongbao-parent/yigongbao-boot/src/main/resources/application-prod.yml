server:
  # 服务器端口（HTTP API）
  port: 8082
  servlet:
    # 项目 context-path
    context-path: /api
  # Tomcat 配置
  tomcat:
    # 最大工作线程数
    max-threads: 200
    # 最小工作线程数
    min-spare-threads: 10

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yigongbao}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      # 最小空闲连接数
      minimum-idle: 10
      # 最大连接池大小
      maximum-pool-size: 50
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 空闲连接超时时间
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 16
          # 连接池最大空闲连接数
          max-idle: 8
          # 连接池最小空闲连接数
          min-idle: 4
          # 连接池最大阻塞等待时间（毫秒）
          max-wait: -1ms

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      # 忽略 Map 中的 null 值
      write-null-map-values: false

  # 邮件配置（生产环境，发件邮箱和密码通过环境变量注入）
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  # 文件上传配置
  servlet:
    multipart:
      # 启用 multipart 上传
      enabled: true
      # 最大单个文件大小（全局上限 5GB，各业务类型由业务层单独校验）
      max-file-size: 5GB
      # 最大请求总大小（全局上限 5GB）
      max-request-size: 5GB
      # 文件写入磁盘的阈值
      file-size-threshold: 512KB

# MyBatis-Plus 配置
mybatis-plus:
  # 配置扫描通用枚举
  type-enums-package: com.yigongbao.common.enums
  global-config:
    db-config:
      # 主键策略
      id-type: auto
      # 逻辑删除字段（软删除）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 驼峰命名映射
    map-underscore-to-camel-case: true
    # 生产环境不打印 SQL
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  # 配置扫描 XML
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（秒），默认 30 天
  timeout: 2592000
  # token 临时有效期（秒），指定时间后 token 失效
  active-timeout: -1
  # 是否允许同一账号多端同时在线（禁止并发登录，新登录会踢出旧会话）
  is-concurrent: false
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false


# dromara x-file-storage 配置（文件存储框架）
dromara:
  x-file-storage:
    # 默认存储平台（使用腾讯云 COS）
    default-platform: tencent-cos-1
    #缩略图后缀
    thumbnail-suffix: ".min.jpg"
    # 腾讯云 COS 配置
    tencent-cos:
      - platform: tencent-cos-1
        enable-storage: true
        # SecretId（从环境变量注入，禁止硬编码）
        secret-id: ${COS_SECRET_ID}
        # SecretKey（从环境变量注入，禁止硬编码）
        secret-key: ${COS_SECRET_KEY}
        # 地域（如：ap-beijing, ap-shanghai, ap-guangzhou）
        region: ${COS_REGION:ap-beijing}
        # Bucket 名称
        bucket-name: ${COS_BUCKET:yigongbao}
        # 文件访问域名（CDN 域名或 COS 公网域名）
        domain: ${COS_DOMAIN}
        # 存储路径前缀（可为空）
        base-path:
    # 阿里云 OSS 配置（备用平台）
    aliyun-oss:
      - platform: aliyun-oss-1
        enable-storage: true
        # AccessKey（从环境变量注入，禁止硬编码）
        access-key: ${OSS_ACCESS_KEY}
        # SecretKey（从环境变量注入，禁止硬编码）
        secret-key: ${OSS_SECRET_KEY}
        # Endpoint（如：oss-cn-hangzhou.aliyuncs.com）
        end-point: ${OSS_ENDPOINT}
        # Bucket 名称
        bucket-name: ${OSS_BUCKET:yigongbao}
        # 文件访问域名（CDN 域名或 OSS 公网域名）
        domain: ${OSS_DOMAIN}
        # 存储路径前缀（可为空）
        base-path:
    # 本地存储（生产备用，不作为默认平台）
    local-plus:
      - platform: local-plus-1
        # 启用本地存储
        enable-storage: true
        # 启用本地文件访问（生产环境建议使用 Nginx）
        enable-access: true
        # 文件访问基础路径（用于拼装 fileUrl）
        domain: http://localhost:8080/api/files/public/
        # 基础路径
        base-path:
        # URL 路径匹配模式（SaToken 中需放行此路径）
        path-patterns: /files/public/**
        # 存储根路径（Docker容器内路径）
        storage-path: /app/files/

# 应用安全配置
app:
  sign:
    # 请求签名密钥，生产环境通过环境变量 APP_SIGN_SECRET 注入
    secret: ${APP_SIGN_SECRET}
  rate-limit:
    # 全局默认限流：每个接口独立计数，60次/分钟（约5次/秒）
    default-limit: 60
    # 时间窗口（秒）
    default-window: 60

# 短信配置（生产环境）
sms:
  mock:
    # 生产环境短信 Mock 重定向邮箱（留空则仅打印日志）
    redirect-email: ${SMS_MOCK_REDIRECT_EMAIL:}

# 行为验证码配置
captcha:
  # 如果项目中使用到了redis，滑块验证码会自动把验证码数据存到redis中， 这里配置redis的key的前缀,默认是captcha:slider
  prefix: captcha
  # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
  expire:
    # 默认缓存时间 2分钟
    default: 120000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 120000
  # 使用加载系统自带的资源， 默认是 false(这里系统的默认资源包含 滑动验证码模板/旋转验证码模板,如果想使用系统的模板，这里设置为true)
  init-default-resource: true
  # 缓存控制， 默认为false不开启
  local-cache-enabled: false
  # 缓存开启后，验证码会提前缓存一些生成好的验证数据， 默认是20
  local-cache-size: 20
  # 缓存开启后，缓存拉取失败后等待时间 默认是 5秒钟
  local-cache-wait-time: 5000
  # 缓存开启后，缓存检查间隔 默认是2秒钟
  local-cache-period: 2000
  # 缓存开启后，忽略的字段，默认是 ""(不忽略任何字段)
  local-cache-ignored-cache-fields: ""
  # 配置字体包，供文字点选验证码使用,可以配置多个，不配置使用默认的字体
  font-path:
    - classpath:font/SimHei.ttf
  secondary:
    # 二次验证，默认开启（验证码校验成功后生成 token，登录时必须验证 token）
    enabled: true
    # 二次验证过期时间， 默认 2分钟
    expire: 120000
    # 二次验证缓存key前缀，默认是 captcha:secondary
    keyPrefix: "captcha:secondary"

# 医工宝系统配置
yigongbao:
  # 系统配置兜底默认值（当数据库配置不存在或已禁用时使用）
  config:
    # ==================== 安全配置 ====================
    # 默认密码（从环境变量注入，禁止硬编码）
    default-password: ${DEFAULT_PASSWORD}
    # 最大连续登录失败次数
    login-max-failures: 5
    # 登录锁定时长（分钟）
    login-lock-duration: 15
    # 短信发送间隔（秒）
    sms-send-interval: 60
    # ==================== 系统配置 ====================
    # 系统名称
    system-name: "医工宝"
    # 文件上传最大大小（字节），默认 5000MB
    max-upload-size: 5242880000
    # ==================== 订单配置 ====================
    # 提交订单是否必须上传影像文件（true-必须，false-非必填）
    order-image-required: true
    # 草稿自动过期天数，默认 30 天
    order-draft-expire-days: 30
    # 订单提交后修改窗口期（分钟），默认 10 分钟
    order-modify-window-minutes: 10
    # ==================== 流程状态机配置 ====================
    # 最大允许的审核驳回次数，默认 3 次
    flow-max-audit-reject: 3
    # 最大允许的返工次数，默认 2 次
    flow-max-rework: 2
    # 最大允许的设计审核驳回次数，默认 3 次
    flow-max-design-reject: 3
  # 文件存储业务配置
  file-storage:
    # 最大文件大小（字节），默认 5000MB
    max-file-size: 5242880000
    download-url-expire-minutes: 10
    # 允许的文件扩展名
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - zip
      - rar
      - stl
      - obj
      - 3ds
      - ply
      - step
      - dcm

# springdoc-openapi 配置（生产环境：只开放 API 文档 JSON，禁用 Swagger UI）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: false
